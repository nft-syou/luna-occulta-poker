<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">宵闇の賭場</title>
  <!-- The logo's eclipse: a black moon, a crimson corona and a gold edge of light on the right. -->
  <defs>
    <filter id="corona" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="edge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="13" fill="#131320"/>
  <circle cx="32" cy="32" r="23.5" fill="#961c34" filter="url(#corona)"/>
  <circle cx="32" cy="32" r="22.4" fill="#e8c478" filter="url(#edge)"/>
  <circle cx="30.5" cy="32" r="21.8" fill="#0a0a12"/>
</svg>
